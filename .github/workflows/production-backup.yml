name: Production database backup and restore drill

on:
  schedule:
    - cron: '13 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentryloot-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_KEY_B64 }}
      R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      R2_EVIDENCE_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check required secrets
        run: |
          for name in DATABASE_URL BACKUP_ENCRYPTION_KEY_B64 R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_EVIDENCE_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "Required secret is missing: $name" >&2
              exit 1
            fi
          done
      - name: Install backup libraries
        run: python -m pip install 'boto3>=1.35,<2' 'cryptography==50.0.1'
      - name: Export PostgreSQL 18 custom archive
        run: |
          docker run --rm -e DATABASE_URL -v "$RUNNER_TEMP:/out" postgres:18 \
            sh -ec 'pg_dump --dbname="$DATABASE_URL" --schema=public --format=custom --no-owner --no-acl --file=/out/sentryloot.dump'
      - name: Encrypt and upload to private R2
        id: upload
        run: python scripts/backup_postgres_r2.py backup --input "$RUNNER_TEMP/sentryloot.dump" --github-output "$GITHUB_OUTPUT"
      - name: Download and authenticate uploaded archive
        run: python scripts/backup_postgres_r2.py restore-check --key '${{ steps.upload.outputs.backup_key }}' --output "$RUNNER_TEMP/verified.dump"
      - name: Restore into isolated PostgreSQL 18
        run: |
          docker run -d --name sentryloot-restore --network none -e POSTGRES_PASSWORD=local-restore-only \
            -v "$RUNNER_TEMP:/out" postgres:18
          for attempt in $(seq 1 30); do
            if docker exec sentryloot-restore pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec sentryloot-restore psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'DROP SCHEMA public CASCADE'
          docker exec sentryloot-restore pg_restore --no-owner --no-acl -U postgres -d postgres /out/verified.dump
          count=$(docker exec sentryloot-restore psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r'")
          test "$count" -ge 36
          echo "Restored $count public tables into an isolated database."
      - name: Remove archives and restore container
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sentryloot.dump" "$RUNNER_TEMP/verified.dump"
          docker rm -f sentryloot-restore >/dev/null 2>&1 || true
      - name: Retain 35 days of encrypted backups
        if: success()
        run: python scripts/backup_postgres_r2.py prune --days 35

      - name: Email monitoring failure to support
        if: failure()
        env:
          EMAIL_PROVIDER: resend
          EMAIL_FROM: SentryLoot Monitoring <alerts@mail.gamestorehub.com>
          RESEND_API_KEY: ${{ secrets.MONITOR_RESEND_API_KEY }}
          PUBLIC_BASE_URL: https://gamestorehub.com
          MARKETPLACE_MODE: production
        run: python scripts/send_monitor_alert.py --workflow "Production database backup and restore" --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
