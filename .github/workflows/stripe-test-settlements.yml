name: Stripe sandbox settlements
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentryloot-stripe-test-settlements
  cancel-in-progress: false
jobs:
  settle:
    if: vars.STRIPE_TEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENTRYLOOT_ENV_FILE: /dev/null
      MARKETPLACE_MODE: production
      MARKETPLACE_INTERNAL_TESTING_ENABLED: 'true'
      MARKETPLACE_SALES_ENABLED: 'false'
      PAYMENT_PROVIDER: stripe_test
      PUBLIC_BASE_URL: https://gamestorehub.com
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_ACCOUNT_ID: acct_1TZr0XGzjiXnroEi
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Process verified test refunds and seller transfers
        run: python scripts/process_stripe_test_payments.py
